name: Daily Stock Magazine Auto-Publish

# TARGET: publish every weekday at 16:20 Israel local time.
#
# GitHub cron has no timezone support — it is always UTC — so a fixed UTC hour
# drifts by an hour twice a year when Israel switches between IST (UTC+2) and
# IDT (UTC+3). Rather than hand-editing this file every March and October, we
# fire at all three plausible UTC hours and let the job itself decide, at
# runtime, using the real Israel local clock:
#
#   local hour <  16  -> too early (the correct-time trigger is still coming) -> skip
#   local hour == 16  -> this IS 16:20 Israel time -> RUN
#   local hour >  16  -> late/catch-up -> run ONLY if today's magazine is missing
#
# Net effect, verified against both seasons: exactly one real publish per
# weekday, plus two cheap no-op safety nets that rescue a missed or delayed
# run. No DST maintenance ever required.
#
#            | summer (UTC+3)      | winter (UTC+2)
#   13:20 UTC| 16:20 -> PRIMARY    | 15:20 -> skip (early)
#   14:20 UTC| 17:20 -> catch-up   | 16:20 -> PRIMARY
#   15:20 UTC| 18:20 -> catch-up   | 17:20 -> catch-up

on:
  schedule:
    - cron: '20 13 * * 1-5'
    - cron: '20 14 * * 1-5'
    - cron: '20 15 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

env:
  TARGET_HOUR_ISRAEL: '16'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runtime gate — see the header comment for the full rationale.
      # Uses %-H (unpadded) deliberately: a zero-padded "08" would be parsed
      # as invalid octal by shell arithmetic and break the comparison.
      - name: Decide whether to run
        id: gate
        run: |
          TODAY_FILE="magazines/PreMarket_$(date -u +'%m%d%Y').html"
          echo "today_file=$TODAY_FILE" >> "$GITHUB_OUTPUT"

          ISRAEL_HOUR=$(TZ='Asia/Jerusalem' date +%-H)
          ISRAEL_TIME=$(TZ='Asia/Jerusalem' date +'%Y-%m-%d %H:%M %Z')
          echo "Israel local time is $ISRAEL_TIME (hour=$ISRAEL_HOUR), target hour=$TARGET_HOUR_ISRAEL"

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding regardless of clock."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$ISRAEL_HOUR" -lt "$TARGET_HOUR_ISRAEL" ]; then
            echo "Too early in Israel ($ISRAEL_HOUR:xx) - the on-time trigger is still ahead. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$ISRAEL_HOUR" -eq "$TARGET_HOUR_ISRAEL" ]; then
            echo "On-time primary run for 16:20 Israel time - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$TODAY_FILE" ]; then
            echo "Catch-up window, but $TODAY_FILE already exists - nothing to do. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Catch-up window and $TODAY_FILE is MISSING - the on-time run did not publish. Recovering now."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      # Configure Git
      - name: Configure Git
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "Stock Magazine Bot"
          git config user.email "bot@stockmagazine.dev"

      # Generate magazine.
      # generate-magazine.py exits nonzero on failure, so a crash fails this
      # step loudly instead of showing a false green check.
      - name: Generate daily magazine
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python3 scripts/generate-magazine.py
          echo "✅ Magazine generated"

      # Post-condition guard: prove the file we expect actually exists and is
      # non-empty before anything downstream claims success.
      - name: Verify today's magazine was created
        if: steps.gate.outputs.should_run == 'true'
        run: |
          TODAY_FILE="${{ steps.gate.outputs.today_file }}"
          if [ ! -s "$TODAY_FILE" ]; then
            echo "::error::Expected $TODAY_FILE to exist and be non-empty, but it does not. Failing the run."
            ls -la magazines/ || true
            exit 1
          fi
          echo "✅ Verified $TODAY_FILE ($(wc -c < "$TODAY_FILE") bytes)"

      # Lean AI analyst pass (one Gemini call per ticker, not the full
      # TradingAgents multi-agent framework — see scripts/ai-analyst.mjs for
      # the reasoning). Soft-fails on purpose: never blocks the magazine
      # publish step above. All outcomes, including failures, are logged to
      # ai-verdicts/log.jsonl as the control/audit trail.
      - name: Run AI analyst (Gemini)
        if: steps.gate.outputs.should_run == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/ai-analyst.mjs
          echo "✅ AI analyst step finished (see ai-verdicts/log.jsonl for outcome)"

      # S&P 500 Daily Spotlight — rotating in-depth company profiles.
      # Every published ticker must have a real business description
      # (Wikipedia), a real employee count (Wikidata), and an official
      # website link (Finnhub); any ticker missing one of the three is
      # skipped and a different S&P 500 company is tried in its place.
      # Soft-fails on purpose, same as the AI analyst step above — never
      # blocks the magazine publish. See sp500-picks/log.jsonl for outcome.
      - name: Run S&P 500 daily spotlight
        if: steps.gate.outputs.should_run == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/sp500-picks.mjs
          echo "✅ S&P 500 spotlight step finished (see sp500-picks/log.jsonl for outcome)"

      # Cloud archive write — appends today's stock snapshots to Vercel KV
      # (Upstash Redis) for the "Cloud Archive" table and "Last Updated"
      # badge. Purely additive: only reads ai-verdicts/latest.json (already
      # produced above) and writes to KV — never touches the magazine,
      # AI analyst, or S&P 500 generation logic. Soft-fails on purpose,
      # same as the steps above.
      - name: Archive daily snapshot to Vercel KV
        if: steps.gate.outputs.should_run == 'true'
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: |
          node scripts/archive-to-kv.mjs
          echo "✅ KV archive step finished"

      # Auto-commit new files
      - name: Auto-commit new magazines
        if: steps.gate.outputs.should_run == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: 'magazines/*.html ai-verdicts/*.json ai-verdicts/*.jsonl sp500-picks/*.json sp500-picks/*.jsonl'
          commit_message: 'Daily stock magazine + AI analyst + S&P 500 spotlight'
          skip_dirty_check: false
          skip_fetch: false
          skip_checkout: false
          commit_user_name: 'Stock Magazine Bot'
          commit_user_email: 'bot@stockmagazine.dev'
          push_options: '--force-with-lease'

      # Confirm the commit actually landed on the remote. Without this, a
      # push rejected by --force-with-lease would pass silently.
      - name: Verify magazine is committed on origin/main
        if: steps.gate.outputs.should_run == 'true'
        run: |
          TODAY_FILE="${{ steps.gate.outputs.today_file }}"
          git fetch origin main --quiet
          if git cat-file -e "origin/main:$TODAY_FILE" 2>/dev/null; then
            echo "✅ $TODAY_FILE is present on origin/main"
          else
            echo "::error::$TODAY_FILE was generated but is NOT on origin/main - the push did not land."
            exit 1
          fi

  # Notify on success
  notify:
    needs: publish
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Log success
        run: |
          echo "✅ Daily magazine published successfully!"
          echo "Published at: $(TZ='Asia/Jerusalem' date +'%Y-%m-%d %H:%M %Z')"

  # Notify on FAILURE. This is the alarm that was missing: previously a failed
  # publish produced no notification at all, so a broken day looked identical
  # to a quiet one. Uses the Telegram secrets already configured in the repo.
  notify-failure:
    needs: publish
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Send Telegram failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::error::Daily publish FAILED. See $RUN_URL"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set - skipping alert."
            exit 0
          fi
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Daily Stock Magazine FAILED to publish ($(TZ='Asia/Jerusalem' date +'%Y-%m-%d %H:%M %Z')). Run: ${RUN_URL}" \
            > /dev/null || echo "Telegram alert failed to send (non-fatal)."
          echo "Failure alert dispatched."
