name: TEST - Telegram Diagnostic

# TEMPORARY, MANUAL-ONLY. Diagnoses why the failure alarm could not deliver.
# Sends NO messages. Only asks Telegram which bot the token belongs to and
# which chats that bot can actually see. Delete once alerting is fixed.

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo '=== 1. Is the BOT TOKEN valid? ==='
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" -o /tmp/me.json
          jq -r 'if .ok then "TOKEN VALID - bot is @" + .result.username else "TOKEN INVALID: " + .description end' /tmp/me.json

          echo ''
          echo '=== 2. What chat id is currently configured? ==='
          echo "configured value: ${TELEGRAM_CHAT_ID}"
          case "$TELEGRAM_CHAT_ID" in
            -100*) echo 'format: supergroup/channel id' ;;
            -*)    echo 'format: NEGATIVE = a GROUP id. A personal chat id must be POSITIVE.' ;;
            *)     echo 'format: positive = personal chat id' ;;
          esac

          echo ''
          echo '=== 3. Which chats can the bot actually see? ==='
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates" -o /tmp/up.json
          COUNT=$(jq -r '.result | length' /tmp/up.json)
          if [ "$COUNT" = "0" ]; then
            echo 'NO CHATS VISIBLE.'
            echo 'Open Telegram, find the bot from step 1, press START / send /start, then re-run this workflow.'
          else
            jq -r '.result[]? | (.message // .channel_post // .my_chat_member) as $m | select($m != null) | "USE THIS -> chat_id=" + ($m.chat.id|tostring) + "   type=" + $m.chat.type + "   name=" + (($m.chat.title // $m.chat.username // $m.chat.first_name) // "?")' /tmp/up.json | sort -u
          fi
